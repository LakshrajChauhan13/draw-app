name: CD Pipeline - Dev Environment

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            # 1. Load the Node Version Manager (NVM) and bash profile
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 2. Navigate to the project directory
            cd ~/draw-app 
            
            # 3. Pull the latest code from the dev branch
            git checkout dev
            git pull origin dev 
            
            # 4. Install dependencies and compile the Turborepo workspace
            pnpm install --frozen-lockfile
            pnpm run build 
            
            # 5. Reload all PM2 processes safely
            pm2 reload all